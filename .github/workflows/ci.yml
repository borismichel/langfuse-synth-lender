# Runs the kit's pytest suite on every push / PR so the byte-identical gates fail loudly in
# CI, not just locally. This repo previously had only the publish (tag) workflow (Spec G · G5,
# #144). GitHub-hosted runner: the repo is PUBLIC, so hosted minutes are free and the
# infrastructure policy requires GitHub-hosted CI/CD (no self-hosted runners on public repos).
#
# Installing `.[dev,playground]` pulls langfuse-synth-core[authoring] (the determinism golden
# gate's marker dep, jsonschema) AND langfuse-synth-core[companion] (the live-UI web-server
# deps, fastapi/uvicorn) — so BOTH the spool-determinism golden and the 22 presenter-visible
# UI goldens actually RUN here rather than skip. The suite is network-free: the UI goldens
# render through Starlette's in-process TestClient against an offline catalog, the adapter
# wiring suite runs on fakes, and the determinism golden runs its seed in a subprocess under
# its own deny-LLM egress block — so no project secret ever touches this job (GITHUB_TOKEN
# aside, which GitHub mints for the run).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep the #251 reproduction on the SDK from the reported release, plus
        # the version a fresh image resolves from the supported runtime range.
        sdk: ["langfuse==4.14.4", "langfuse>=4.14,<5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches the runtime image (Dockerfile: python:3.12-slim)
      - name: Install (runtime + dev + playground, from the pinned core)
        run: pip install -e '.[dev,playground]' '${{ matrix.sdk }}'
      - name: Test (spool-determinism golden + presenter-visible UI goldens + unit suite)
        run: pytest -q
      # The Contract as executable checks (portal #198). `--advisory` covers this kit's remaining convergence debt (the target companion
      # shape) and NOTHING else: since portal #213 the v4-migration checks — a deprecated
      # Langfuse endpoint, an observation type outside the vocabulary — block whether or not
      # this flag is passed. Drop the flag when the shape debt is paid.
      - name: Contract conformance (synth-authoring conformance; shape debt advisory)
        run: synth-authoring conformance . --advisory

  # Keep the repository ruleset's required check named `test` while requiring
  # every SDK matrix entry to pass. Failed/cancelled jobs must fail this gate.
  test:
    runs-on: ubuntu-latest
    needs: sdk-test
    if: always()
    steps:
      - name: Require all SDK checks
        env:
          SDK_RESULT: ${{ needs.sdk-test.result }}
        run: test "$SDK_RESULT" = success
