[project]
name = "langfuse-demo-synth-lender"
version = "0.3.0"
description = "Synthesiser for believable Langfuse demo data — regulated-lender model-certification scenario (filing copilot + certification gate)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The shared byte-identical core (Ring 1, #31/#32): RNG/ID, pricing, distributions, the
    # Langfuse client, event emission, and the live-UI primitives now live in the lib.
    # Pinned to an immutable ref (never a moving branch). Spec G · G5 (#144) bumps this from
    # v1.2.1 to the SHA carrying the Companion Adapter (the runtime shell + LLM-resolution
    # module the live Surface now inherits, #138/#140) AND this ring's boundary amendment —
    # `adapter.llm(model)`, the per-request model this kit's copilot selector and workbench
    # release need. A SHA pin, with the tag repin to follow in the Spec G release slice, per
    # the Ring 1b precedent. Every core ref below (this runtime pin, the [playground] ->
    # core[companion] extra, and the [authoring] dev pin) MUST share this ONE ref (see the
    # lib's RELEASING.md): the shell the kit runs against, the web-server deps it serves
    # through, and the golden gate that reproduces its oracle are then the one identical
    # build, so this kit's vendor-approved output can't be silently rewritten by a lib change
    # — bump the pin deliberately. The repo is public, so the install is a plain pip install
    # (the Docker build installs `git` to fetch it — no build secret). langfuse below is still
    # declared directly: it is this kit's own SDK surface (run_experiment, prompts,
    # datasets), not only the lib's.
    "langfuse-synth-core @ git+https://github.com/borismichel/langfuse-synth-core@v1.8.0",
    "langfuse>=4.0,<5",      # v4 Python SDK (run_experiment, prompts, datasets, api client)
    "anthropic>=0.40.0",     # live model calls at demo time — Anthropic provider (default)
    "openai>=1.40.0",        # live model calls at demo time — OpenAI provider (LAN-378)
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
playground = [           # `synth playground` — the analyst-copilot UI + /dossier + /workbench
    # Spec G · G5 (#144): the live Surface now runs on the Companion Adapter, so the
    # web-server deps this kit used to declare here (fastapi/uvicorn/python-multipart)
    # collapse onto the core [companion] extra — the ONE canonical set, shared by every
    # migrated kit. Same ref as the runtime pin above (see RELEASING.md); bump both together,
    # never let them drift.
    "langfuse-synth-core[companion] @ git+https://github.com/borismichel/langfuse-synth-core@v1.8.0",
]
dev = [                  # dev/authoring-time only — NEVER in the runtime image (Spec A §3)
    "pytest>=8,<9",
    # Determinism golden gate + `synth-authoring freeze`. Adds the [authoring] extra on top
    # of the runtime core pin above — SAME ref (the released tag; #145 G6), so the gate that reproduces the
    # oracle and the core the kit runs against are the one, identical build. Bump both pins
    # together, never let them drift apart.
    "langfuse-synth-core[authoring] @ git+https://github.com/borismichel/langfuse-synth-core@v1.8.0",
]

[project.scripts]
synth = "synth.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
